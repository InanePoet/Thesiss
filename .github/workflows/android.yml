name: Android APK
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 mancante: APK firmato con chiave di prova, pubblicato solo come anteprima"
            echo "SIGNED=0" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PversionCode=${{ github.run_number }} \
            -PversionName=$APP_VERSION
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/app.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app.apk
      - name: Pubblica release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message || 'Build manuale' }}
        run: |
          gh release delete bootstrap --yes --cleanup-tag || true
          if [ "$SIGNED" = "1" ]; then
            gh release create "v$APP_VERSION" app.apk --title "v$APP_VERSION" --notes "$NOTES" --latest
          else
            gh release delete anteprima --yes --cleanup-tag || true
            gh release create anteprima app.apk --prerelease --title "Anteprima (firma di prova)" --notes "Build con firma di prova: installala solo per provare. $NOTES"
          fi
